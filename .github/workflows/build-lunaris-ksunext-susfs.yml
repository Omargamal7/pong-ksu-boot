name: EXPERIMENTAL Build Lunaris KernelSU Next dev-susfs

# Prototype only. pershoot/KernelSU-Next dev-susfs (official dev + SUSFS v2.3.0)
# with simonpunk susfs4ksu's android12-5.10 kernel patch. The release workflow is
# build-lunaris-ksunext.yml; this one never replaces its artifacts.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lunaris-ksunext-susfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_REPO: Pong-Development/kernel_nothing_sm8475_old
      COMMON_COMMIT: 7cccdf9b9c80932d8402e6fe1d51e56fff7fbdb2
      NEXT_COMMIT: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      SUSFS_COMMIT: f43926dc94b8ffbf9b74321313536600f69367b1
      TOOLCHAIN_COMMIT: 2d4dcbff7cb42f360f368bacf51cfe711fd1cb0f
      BUILD_INFO_SHA256: 56cfce8294ee8bff7150f1bb666ce84986d8e51931df5889a29ba89cf3a0db0f
      BUILD_PROFILE: meteoric-r547379-lto-none-susfs-experimental-v1
      BOOT_TOOLS_COMMIT: d2bb0af5ba6d3198a3e99529c97eda1be0b5a093
      AVB_COMMIT: 761178607206f4cb2af79ed9eec52d8cbd814adb
      AVBTOOL_SHA256: e5a664a38db623da00f080219bc0ee60a640a9dc4a872803616fae4938ac749b
      ABI_EXTRACTOR_COMMIT: 2d094bc9c220b6b50f8215cbc3c9e581210ce1a6
      BOOT_SHA256: f86ca8c2a1f731a921813cecf0de1d693ed795f684cfb10cf1140bee4781cc7d
      # Official KernelSU Next CI build of dev b427a3f (the dev-susfs merge-base), run 39297115788.
      MANAGER_ARTIFACT_ID: '12209218898'
      MANAGER_ZIP_SHA256: 01c3280daa769e634b955b2a43f032082c27268191c70bdbdba05d5f37b5a7b8
      MANAGER_CERT: 0x3e6:79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
      CCACHE_DIR: ${{ github.workspace }}/work/ccache
    steps:
      - name: Check out build definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim hosted-runner disk and check capacity
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p work
          df -h "$GITHUB_WORKSPACE" > work/runner-storage.log
          sudo du -xsh /opt/hostedtoolcache /usr/lib/jvm /usr/local/share/chromium \
            /opt/google /opt/microsoft /usr/local/julia* \
            >> work/runner-storage.log 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/powershell /opt/az /usr/share/swift /usr/lib/jvm \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/julia*
          sudo docker system prune --all --force > work/runner-docker-prune.log 2>&1 || true
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE" >> work/runner-storage.log
          cat work/runner-storage.log
          available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          test "$available" -ge $((45 * 1024 * 1024)) || {
            echo 'At least 45 GiB free space is required before fetching build inputs.' >&2
            exit 1
          }

      - name: Install build dependencies
        timeout-minutes: 12
        run: |
          bash scripts/configure_cloud_apt.sh
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=120 -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            bc binutils-aarch64-linux-gnu bison build-essential ccache cpio \
            dwarves flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev lz4 \
            python3 python3-pip python3-venv rsync xz-utils

      - name: Install pinned original-kernel ABI extractor
        run: |
          set -euo pipefail
          python3 -m venv work/abi-venv
          CC=gcc work/abi-venv/bin/pip install --no-cache-dir \
            'pyelftools==0.32' \
            "git+https://github.com/marin-m/vmlinux-to-elf.git@$ABI_EXTRACTOR_COMMIT"

      - name: Run boot and ABI verifier tests
        run: work/abi-venv/bin/python -m unittest discover -s tests -v

      - name: Download and verify installed Lunaris boot image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download lunaris-boot-input --repo "$GITHUB_REPOSITORY" \
            --pattern boot-current.img --output boot-current.img
          printf '%s  %s\n' "$BOOT_SHA256" boot-current.img | sha256sum --check --strict
          python3 scripts/prepare_lunaris_boot.py --boot boot-current.img --output-dir work/original

      - name: Extract original exported-symbol ABI and exact whitelist
        run: |
          work/abi-venv/bin/python scripts/verify_kernel_abi.py \
            --original-image work/original/kernel --report work/original/abi-baseline.json \
            --export-whitelist work/original/abi_symbollist.raw

      - name: Fetch pinned kernel, root core and boot tools
        run: |
          set -euo pipefail
          mkdir -p work/source work/mkbootimg
          git -C work/source init -q
          git -C work/source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C work/source fetch --depth=1 --no-tags origin "$COMMON_COMMIT"
          git -C work/source checkout -q --detach FETCH_HEAD
          test "$(git -C work/source rev-parse HEAD)" = "$COMMON_COMMIT"
          # Full blobless history with origin/dev and tags: dev-susfs's Kbuild derives
          # its version from the local branch name and the merge-base with origin/dev.
          git clone --filter=blob:none --no-checkout \
            https://github.com/pershoot/KernelSU-Next.git work/KernelSU-Next
          git -C work/KernelSU-Next checkout -q -B dev-susfs "$NEXT_COMMIT"
          test "$(git -C work/KernelSU-Next rev-parse HEAD)" = "$NEXT_COMMIT"
          mkdir -p work/susfs4ksu
          git -C work/susfs4ksu init -q
          git -C work/susfs4ksu remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          git -C work/susfs4ksu fetch --depth=1 --no-tags origin "$SUSFS_COMMIT"
          git -C work/susfs4ksu checkout -q --detach FETCH_HEAD
          test "$(git -C work/susfs4ksu rev-parse HEAD)" = "$SUSFS_COMMIT"
          git -C work/mkbootimg init -q
          git -C work/mkbootimg remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C work/mkbootimg fetch --depth=1 --no-tags origin "$BOOT_TOOLS_COMMIT"
          git -C work/mkbootimg checkout -q --detach FETCH_HEAD
          test "$(git -C work/mkbootimg rev-parse HEAD)" = "$BOOT_TOOLS_COMMIT"
          mkdir -p work/avb
          git -C work/avb init -q
          git -C work/avb remote add origin https://android.googlesource.com/platform/external/avb
          git -C work/avb config remote.origin.promisor true
          git -C work/avb config remote.origin.partialclonefilter blob:none
          git -c protocol.version=2 -C work/avb fetch --depth=1 --filter=blob:none --no-tags origin "$AVB_COMMIT"
          git -C work/avb sparse-checkout set --no-cone /avbtool.py
          git -C work/avb checkout -q --detach FETCH_HEAD
          test "$(git -C work/avb rev-parse HEAD)" = "$AVB_COMMIT"
          printf '%s  %s\n' "$AVBTOOL_SHA256" work/avb/avbtool.py | sha256sum --check --strict

      - name: Test AVB footer copying with pinned avbtool
        run: AVBTOOL=work/avb/avbtool.py python3 -m unittest tests.test_avb_footer -v

      - name: Restore pinned Android Clang
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: work/toolchain
          key: lunaris-clang-r547379-${{ env.TOOLCHAIN_COMMIT }}

      - name: Download exact original Clang or fetch sparse official prebuilt
        if: steps.clang-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p work/toolchain
          archive="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$TOOLCHAIN_COMMIT/clang-r547379.tar.gz"
          if curl --fail --location --retry 0 --connect-timeout 20 --max-time 420 --speed-time 30 --speed-limit 1024 \
            "$archive" --output work/clang.tar.gz && tar -xzf work/clang.tar.gz -C work/toolchain; then
            echo 'official scoped archive' > work/toolchain-download-method.txt
          else
            echo 'Scoped archive failed; fetching the same pinned official prebuilt through sparse Git.'
            rm -rf work/toolchain
            mkdir -p work/toolchain work/clang-prebuilts
            git -C work/clang-prebuilts init -q
            git -C work/clang-prebuilts remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
            git -C work/clang-prebuilts config remote.origin.promisor true
            git -C work/clang-prebuilts config remote.origin.partialclonefilter blob:none
            git -c protocol.version=2 -C work/clang-prebuilts fetch --depth=1 --filter=blob:none --no-tags origin "$TOOLCHAIN_COMMIT"
            git -C work/clang-prebuilts sparse-checkout init --cone
            git -C work/clang-prebuilts sparse-checkout set clang-r547379
            git -c protocol.version=2 -C work/clang-prebuilts checkout -q --detach FETCH_HEAD
            test "$(git -C work/clang-prebuilts rev-parse HEAD)" = "$TOOLCHAIN_COMMIT"
            cp -a work/clang-prebuilts/clang-r547379/. work/toolchain/
            rm -rf work/clang-prebuilts
            echo 'official Git protocol v2, shallow filtered sparse checkout' > work/toolchain-download-method.txt
          fi
          rm -f work/clang.tar.gz

      - name: Verify pinned Android Clang
        id: verify-clang
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$BUILD_INFO_SHA256" work/toolchain/BUILD_INFO | sha256sum --check --strict
          test -x work/toolchain/bin/clang
          test -x work/toolchain/bin/ld.lld
          work/toolchain/bin/clang --version | tee work/toolchain-version.txt
          grep -Fq 'Android (13290119, +pgo, +bolt, +lto, +mlgo, based on r547379) clang version 20.0.0' work/toolchain-version.txt
          grep -Fq 'b718bcaf8c198c82f3021447d943401e3ab5bd54' work/toolchain-version.txt

      - name: Save verified Android Clang immediately
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/toolchain
          key: lunaris-clang-r547379-${{ env.TOOLCHAIN_COMMIT }}

      - name: Remove unused compiler distribution variants
        run: |
          set -euo pipefail
          {
            echo 'Before removing unused top-level compiler variants:'
            du -sh work/toolchain
            df -h "$GITHUB_WORKSPACE"
            rm -rf work/toolchain/musl work/toolchain/runtimes_ndk_cxx \
              work/toolchain/android_libc++ work/toolchain/python3
            for tool in clang ld.lld llvm-nm llvm-ar llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              echo "Checking $tool after variant removal:"
              "work/toolchain/bin/$tool" --version
            done
            printf '%s  %s\n' "$BUILD_INFO_SHA256" work/toolchain/BUILD_INFO | sha256sum --check --strict
            echo 'After removing unused top-level compiler variants:'
            du -sh work/toolchain
            df -h "$GITHUB_WORKSPACE"
          } 2>&1 | tee work/toolchain-storage.log

      - name: Restore bounded compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: work/ccache
          key: lunaris-${{ env.BUILD_PROFILE }}-${{ env.COMMON_COMMIT }}-${{ env.NEXT_COMMIT }}-${{ env.TOOLCHAIN_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lunaris-${{ env.BUILD_PROFILE }}-${{ env.COMMON_COMMIT }}-${{ env.NEXT_COMMIT }}-${{ env.TOOLCHAIN_COMMIT }}-

      - name: Provision bounded swap
        run: |
          set -euo pipefail
          if ! swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 6G /swap-lunaris.img
            sudo chmod 600 /swap-lunaris.img
            sudo mkswap /swap-lunaris.img
            sudo swapon /swap-lunaris.img
          fi
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Preflight Next and compile kernel
        id: kernel-build
        run: |
          bash scripts/build_lunaris_susfs_kernel.sh \
            --source work/source --root-source work/KernelSU-Next --susfs-source work/susfs4ksu \
            --toolchain work/toolchain --config inputs/meteoric-5.10.237.config \
            --abi-whitelist work/original/abi_symbollist.raw \
            --output-dir work/build

      - name: Save bounded compiler cache after verified inputs
        if: always() && steps.ccache.outputs.cache-hit != 'true' && hashFiles('work/build/cache-trusted.json') != ''
        uses: actions/cache/save@v4
        with:
          path: work/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify original exported-symbol ABI
        run: |
          work/abi-venv/bin/python scripts/verify_kernel_abi.py --original-image work/original/kernel \
            --symvers work/build/Module.symvers --report work/abi-report.json

      - name: Repack boot image and verify preserved metadata
        run: |
          python3 scripts/repack_lunaris_boot.py --base boot-current.img \
            --kernel work/build/Image --tools work/mkbootimg \
            --output work/repack/boot-lunaris-ksunext-dev-susfs-EXPERIMENTAL.img --partition-size 100663296

      - name: Add AVB hash footer matching the original
        run: |
          python3 scripts/add_lunaris_avb_footer.py --base boot-current.img \
            --image work/repack/boot-lunaris-ksunext-dev-susfs-EXPERIMENTAL.img --avbtool work/avb/avbtool.py \
            --output dist/boot-lunaris-ksunext-dev-susfs-EXPERIMENTAL.img

      - name: Fetch matching official dev manager
        id: manager
        # Cross-repository artifact download with this workflow's token is untested;
        # the kernel candidate does not depend on it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/manager dist
          gh api "repos/KernelSU-Next/KernelSU-Next/actions/artifacts/$MANAGER_ARTIFACT_ID/zip" > work/manager/manager.zip
          printf '%s  %s\n' "$MANAGER_ZIP_SHA256" work/manager/manager.zip | sha256sum --check --strict
          python3 -m zipfile -e work/manager/manager.zip work/manager/extracted
          mapfile -t apks < <(find work/manager/extracted -name '*.apk')
          test "${#apks[@]}" = 1
          python3 scripts/verify_manager_apk.py --apk "${apks[0]}" --accept "$MANAGER_CERT" \
            --report work/manager/certificate.json
          cp "${apks[0]}" dist/

      - name: Collect provenance
        env:
          MANAGER_OUTCOME: ${{ steps.manager.outcome }}
        run: |
          set -euo pipefail
          cp work/build/Image work/build/Module.symvers work/build/System.map \
            work/build/used.config work/build/baseline.config work/build/baseline-provenance.json \
            work/build/config.diff work/build/config-drift.json \
            work/build/kernelrelease.txt work/build/abi_symbollist.raw work/abi-report.json dist/
          cp inputs/meteoric-5.10.237.config dist/embedded-stock.config
          cp work/original/abi-baseline.json dist/original-abi-baseline.json
          cp work/repack/boot-lunaris-ksunext-dev-susfs-EXPERIMENTAL.metadata.json dist/repack-metadata.json
          cp work/build/build.log work/build/preflight.log work/build/preflight-passed.txt \
            work/build/build-state.json work/build/susfs-patch.log dist/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def revision(directory):
              return subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          manifest = {
              'device': 'Nothing Phone (2) / Pong',
              'rom': 'installed LunarisOS',
              'status': 'EXPERIMENTAL dev-susfs prototype; device boot not verified',
              'kernel_release': pathlib.Path('work/build/kernelrelease.txt').read_text().strip(),
              'base_boot_sha256': digest('boot-current.img'),
              'kernel_source': revision('work/source'),
              'kernel_repository': os.environ['SOURCE_REPO'],
              'build_profile': os.environ['BUILD_PROFILE'],
              'configuration_target': 'vendor/meteoric_defconfig',
              'effective_baseline_config_sha256': digest('work/build/baseline.config'),
              'embedded_stock_config_sha256': digest('inputs/meteoric-5.10.237.config'),
              'lto': 'none',
              'root_source': revision('work/KernelSU-Next'),
              'root': 'pershoot/KernelSU-Next dev-susfs / 33405 (base official dev b427a3f), built in',
              'susfs': 'v2.3.0 built in; kernel patch simonpunk/susfs4ksu ' + os.environ['SUSFS_COMMIT'],
              'manager': {'outcome': os.environ['MANAGER_OUTCOME'], 'official_ci_artifact': os.environ['MANAGER_ARTIFACT_ID'],
                          'certificate': os.environ['MANAGER_CERT']},
              'toolchain_source': os.environ['TOOLCHAIN_COMMIT'],
              'compiler_build_info_sha256': digest('work/toolchain/BUILD_INFO'),
              'compiler': subprocess.check_output(['work/toolchain/bin/clang', '--version'], text=True).splitlines()[0],
              'boot_tools_source': revision('work/mkbootimg'),
              'avbtool_source': revision('work/avb'),
              'avb_footer': 'unsigned hash footer copying the original fields; vbmeta partition unchanged',
              'abi_extractor_source': os.environ['ABI_EXTRACTOR_COMMIT'],
              'abi_whitelist_sha256': digest('work/original/abi_symbollist.raw'),
              'workflow_commit': os.environ['GITHUB_SHA'],
              'workflow_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'abi_report': json.loads(pathlib.Path('work/abi-report.json').read_text()),
          }
          pathlib.Path('dist/provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          pathlib.Path('dist/TEST-CANDIDATE.txt').write_text(
              'EXPERIMENTAL: pershoot dev-susfs with SUSFS v2.3.0, not a KernelSU Next release.\n'
              'Cloud build and static checks passed. Device boot has not been verified.\n'
              'Pair it only with the official dev manager from CI run 39297115788 (KernelSU uapi 6);\n'
              'with the v3.4.2 release, ksud reports a UAPI mismatch (5 vs 6) and skips post-fs-data.\n'
              'Keep the original boot image. Test with temporary fastboot boot before considering flashing.\n'
              'Check Android, radio, Wi-Fi, camera, manager version and root allow/deny behavior.\n'
              'This workflow does not flash or modify a phone.\n')
          PY
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Upload verified test candidate
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-meteoric-ksunext-dev-susfs-EXPERIMENTAL
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve raw compiled kernel as unverified diagnostics
        if: always()
        run: |
          set -euo pipefail
          if test -s work/build/arch/arm64/boot/Image; then
            mkdir -p work/diagnostics
            cp work/build/arch/arm64/boot/Image work/diagnostics/unverified-Image
            (cd work/diagnostics && sha256sum unverified-Image > unverified-Image.sha256)
            printf '%s\n' \
              'UNVERIFIED raw compiled kernel, preserved for investigation only.' \
              'Compilation does not establish ABI compatibility or device bootability.' \
              'This file is not a boot image or a verified test candidate. Do not flash it.' \
              > work/diagnostics/UNVERIFIED.txt
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-ksunext-susfs-diagnostics-${{ github.run_attempt }}
          path: |
            work/diagnostics/unverified-Image
            work/diagnostics/unverified-Image.sha256
            work/diagnostics/UNVERIFIED.txt
            work/runner-storage.log
            work/runner-docker-prune.log
            work/toolchain-version.txt
            work/toolchain-download-method.txt
            work/toolchain-storage.log
            work/original/metadata.json
            work/original/abi-baseline.json
            work/original/abi_symbollist.raw
            work/build/build.log
            work/build/preflight.log
            work/build/preflight-passed.txt
            work/build/build-state.json
            work/build/susfs-patch.log
            work/build/cache-trusted.json
            work/build/.config
            work/build/baseline.config
            work/build/baseline-provenance.json
            work/build/embedded-stock.config
            work/build/config.diff
            work/build/config-drift.json
            work/build/kernelrelease.txt
            work/build/Module.symvers
            work/build/System.map
            work/abi-report.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
