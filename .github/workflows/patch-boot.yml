name: Patch boot.img with KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU-Next release tag"
        default: "v3.3.0"
        required: true
      kmi:
        description: "Kernel Module Interface (GKI)"
        default: "android12-5.10"
        required: true
      boot_asset:
        description: "Stock boot.img asset name in the 'input' release"
        default: "boot.img"
        required: true

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch stock boot.img from 'input' release
        run: |
          gh release download input --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ inputs.boot_asset }}" --output boot.img
          echo "Stock boot.img:"
          ls -l boot.img
          sha256sum boot.img

      - name: Download ksud + KMI module (${{ inputs.ksu_tag }})
        run: |
          base="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${{ inputs.ksu_tag }}"
          curl -fsSL "$base/ksud-x86_64-unknown-linux-musl" -o ksud
          curl -fsSL "$base/${{ inputs.kmi }}_kernelsu.ko" -o module.ko
          chmod +x ksud
          echo "ksud version:"; ./ksud -V || true
          echo "module.ko:"; ls -l module.ko

      - name: Patch boot image (LKM mode, keeps LineageOS kernel)
        run: |
          mkdir -p out
          ./ksud boot-patch \
            -b boot.img \
            -m module.ko \
            --kmi "${{ inputs.kmi }}" \
            -o out \
            --out-name boot-kernelsu.img
          echo "=== output dir ==="
          ls -l out

      - name: Verify patched image
        run: |
          f=out/boot-kernelsu.img
          test -s "$f" || { echo "no output image produced"; exit 1; }
          echo "Patched image:"; ls -l "$f"; sha256sum "$f"
          echo "--- KSU marker scan ---"
          if grep -aqc "KernelSU" "$f"; then echo "KernelSU strings: present"; else echo "KernelSU strings: (not found in plain scan)"; fi
          echo "--- stock vs patched differ? ---"
          if cmp -s boot.img "$f"; then echo "WARNING: identical to stock (patch may have failed)"; exit 1; else echo "OK: differs from stock"; fi

      - name: Upload patched boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-kernelsu
          path: out/boot-kernelsu.img
          if-no-files-found: error
