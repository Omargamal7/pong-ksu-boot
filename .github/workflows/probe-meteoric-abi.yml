name: Diagnose Meteoric source ABI fingerprints

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: meteoric-abi-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: pong-old
            repository: Pong-Development/kernel_nothing_sm8475_old
            commit: 7cccdf9b9c80932d8402e6fe1d51e56fff7fbdb2
          - id: miguvt-cleaned
            repository: MiguVT/kernel_nothing_sm8475_cleaned
            commit: 87a807cf8b730f6e5c25c7cfc1a6262379270d16
    env:
      SOURCE_REPO: ${{ matrix.repository }}
      SOURCE_COMMIT: ${{ matrix.commit }}
      TOOLCHAIN_COMMIT: 2d4dcbff7cb42f360f368bacf51cfe711fd1cb0f
      BUILD_INFO_SHA256: 56cfce8294ee8bff7150f1bb666ce84986d8e51931df5889a29ba89cf3a0db0f
      ABI_EXTRACTOR_COMMIT: 2d094bc9c220b6b50f8215cbc3c9e581210ce1a6
      BOOT_SHA256: f86ca8c2a1f731a921813cecf0de1d693ed795f684cfb10cf1140bee4781cc7d
    steps:
      - name: Check out diagnostic definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim hosted-runner disk
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p work
          df -h "$GITHUB_WORKSPACE" > work/runner-storage.log
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/powershell /opt/az /usr/share/swift /usr/lib/jvm \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/julia*
          sudo docker system prune --all --force > work/runner-docker-prune.log 2>&1 || true
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE" >> work/runner-storage.log
          cat work/runner-storage.log
          available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          test "$available" -ge $((20 * 1024 * 1024)) || {
            echo 'At least 20 GiB free space is required for this three-object diagnostic.' >&2
            exit 1
          }

      - name: Install bounded diagnostic dependencies
        timeout-minutes: 12
        run: |
          bash scripts/configure_cloud_apt.sh
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=120 -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            bc binutils-aarch64-linux-gnu bison build-essential cpio dwarves flex \
            gcc-aarch64-linux-gnu git libelf-dev libssl-dev lz4 python3 python3-pip python3-venv rsync xz-utils

      - name: Install pinned ABI extractor and run tests
        run: |
          set -euo pipefail
          python3 -m venv work/abi-venv
          CC=gcc work/abi-venv/bin/pip install --no-cache-dir 'pyelftools==0.32' \
            "git+https://github.com/marin-m/vmlinux-to-elf.git@$ABI_EXTRACTOR_COMMIT"
          work/abi-venv/bin/python -m unittest discover -s tests -v

      - name: Download and verify original Lunaris boot
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download lunaris-boot-input --repo "$GITHUB_REPOSITORY" \
            --pattern boot-current.img --output boot-current.img
          printf '%s  %s\n' "$BOOT_SHA256" boot-current.img | sha256sum --check --strict
          python3 scripts/prepare_lunaris_boot.py --boot boot-current.img --output-dir work/original
          work/abi-venv/bin/python scripts/verify_kernel_abi.py \
            --original-image work/original/kernel --report work/original/abi-baseline.json \
            --export-whitelist work/original/abi_symbollist.raw

      - name: Fetch pinned candidate source
        id: source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p work/source
          git -C work/source init -q
          git -C work/source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C work/source fetch --depth=1 --no-tags origin "$SOURCE_COMMIT"
          git -C work/source checkout -q --detach FETCH_HEAD
          test "$(git -C work/source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Restore original Android Clang 20
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: work/toolchain
          key: lunaris-clang-r547379-${{ env.TOOLCHAIN_COMMIT }}

      - name: Download pinned Clang or fetch sparse official prebuilt
        id: download-clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p work/toolchain
          archive="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$TOOLCHAIN_COMMIT/clang-r547379.tar.gz"
          if curl --fail --location --retry 1 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            "$archive" --output work/clang.tar.gz && tar -xzf work/clang.tar.gz -C work/toolchain; then
            echo 'official scoped archive' > work/toolchain-download-method.txt
          else
            echo 'Scoped archive failed; fetching the same pinned official prebuilt through sparse Git.'
            rm -rf work/toolchain
            mkdir -p work/toolchain work/clang-prebuilts
            git -C work/clang-prebuilts init -q
            git -C work/clang-prebuilts remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
            git -C work/clang-prebuilts config remote.origin.promisor true
            git -C work/clang-prebuilts config remote.origin.partialclonefilter blob:none
            git -c protocol.version=2 -C work/clang-prebuilts fetch --depth=1 --filter=blob:none --no-tags origin "$TOOLCHAIN_COMMIT"
            git -C work/clang-prebuilts sparse-checkout init --cone
            git -C work/clang-prebuilts sparse-checkout set clang-r547379
            git -c protocol.version=2 -C work/clang-prebuilts checkout -q --detach FETCH_HEAD
            test "$(git -C work/clang-prebuilts rev-parse HEAD)" = "$TOOLCHAIN_COMMIT"
            cp -a work/clang-prebuilts/clang-r547379/. work/toolchain/
            rm -rf work/clang-prebuilts
            echo 'official Git protocol v2, shallow filtered sparse checkout' > work/toolchain-download-method.txt
          fi
          rm -f work/clang.tar.gz

      - name: Verify exact original compiler build
        id: verify-clang
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$BUILD_INFO_SHA256" work/toolchain/BUILD_INFO | sha256sum --check --strict
          test -x work/toolchain/bin/clang
          test -x work/toolchain/bin/ld.lld
          work/toolchain/bin/clang --version | tee work/toolchain-version.txt
          grep -Fq 'Android (13290119, +pgo, +bolt, +lto, +mlgo, based on r547379) clang version 20.0.0' work/toolchain-version.txt
          grep -Fq 'b718bcaf8c198c82f3021447d943401e3ab5bd54' work/toolchain-version.txt

      - name: Cache verified original compiler immediately
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/toolchain
          key: lunaris-clang-r547379-${{ env.TOOLCHAIN_COMMIT }}

      - name: Probe saved and ROM configurations with three objects each
        id: probe
        timeout-minutes: 20
        run: |
          set -euo pipefail
          any_passed=0
          for config_mode in saved rom; do
            if bash scripts/probe_meteoric_source.sh --source work/source --toolchain work/toolchain \
              --config inputs/meteoric-5.10.237.config --abi-whitelist work/original/abi_symbollist.raw \
              --original-image work/original/kernel --abi-python work/abi-venv/bin/python \
              --config-mode "$config_mode" --output-dir "work/probe-$config_mode"; then
              any_passed=1
            else
              echo "Diagnostic mode $config_mode failed; the other mode will still be evaluated."
            fi
          done
          test "$any_passed" = 1

      - name: Persist diagnostic workflow outcomes
        if: always()
        env:
          ORIGINAL_OUTCOME: ${{ steps.original.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-clang.outcome }}
          COMPILER_OUTCOME: ${{ steps.verify-clang.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          mkdir -p work
          python3 - <<'PY'
          import json, os, pathlib
          data = {
              'mode': 'diagnostic_source_probe', 'full_kernel_build': False, 'full_abi_verified': False,
              'source_repository': os.environ['SOURCE_REPO'], 'source_commit': os.environ['SOURCE_COMMIT'],
              'toolchain_commit': os.environ['TOOLCHAIN_COMMIT'], 'toolchain_build_info_sha256': os.environ['BUILD_INFO_SHA256'],
              'workflow_commit': os.environ['GITHUB_SHA'],
              'workflow_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'outcomes': {key: os.environ[key] for key in ('ORIGINAL_OUTCOME', 'SOURCE_OUTCOME', 'DOWNLOAD_OUTCOME', 'COMPILER_OUTCOME', 'PROBE_OUTCOME')},
          }
          data['config_modes'] = {}
          for mode in ('saved', 'rom'):
              directory = pathlib.Path('work') / f'probe-{mode}'
              data['config_modes'][mode] = {}
              for name in ('probe-state.json', 'probe-report.json'):
                  path = directory / name
                  if path.is_file():
                      data['config_modes'][mode][name] = json.loads(path.read_text())
          pathlib.Path('work/workflow-state.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload source-specific diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteoric-abi-probe-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            work/workflow-state.json
            work/runner-storage.log
            work/runner-docker-prune.log
            work/toolchain-version.txt
            work/toolchain-download-method.txt
            work/original/metadata.json
            work/original/abi-baseline.json
            work/probe-*/*.json
            work/probe-*/*.log
            work/probe-*/.config
            work/probe-*/used.config
            work/probe-*/config.diff
            work/probe-*/fundamental-config.txt
            work/probe-*/kernelrelease.txt
            work/probe-*/**/*.symversions
            work/probe-*/**/*.symtypes
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
